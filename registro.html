<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Turnos </title>
  <!-- CORREGIDO: antes decía style.css (sin la "s"), por eso no cargaba el CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="registro-body">

  <!-- AGREGADO: fondo de estrellas -->
  <div class="cielo">
    <div class="stars"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
  </div>

  <!-- AGREGADO: contenedor de dos columnas (logo a la izquierda, formulario a la derecha) -->
  <div class="registro-layout">

    <!-- AGREGADO: columna izquierda con el logo -->
    <div class="registro-brand">
      <img src="taxi.jpeg" alt="Cooperativa de Transportes en Taxis 146 - El Tránsito de Chillogallo" class="registro-logo">
    </div>

  <div class="form-container">
    <div class="form-header">
      <h2>Registro de Turno</h2>
      <p class="form-subtitle">Ingrese los datos del socio para asignar el turno en cola</p>
    </div>

    <form id="registerForm" novalidate>

      <!-- CAMPO: UNIDAD -->
      <div class="form-group">
        <label for="unitInput">Número de Unidad</label>
        <span class="input-hint">Ingrese solo números enteros (ej. 104)</span>
        <input 
          type="text" 
          id="unitInput" 
          placeholder="Ej. 45" 
          autocomplete="off"
        >
        <span class="error-message" id="unitError"></span>
      </div>

      <!-- CAMPO: NOMBRE DEL CONDUCTOR -->
      <div class="form-group">
        <label for="driverInput">Socio / Conductor</label>
        <span class="input-hint">Ingrese un nombre y un apellido (ej. Carlos Mendoza)</span>
        <input 
          type="text" 
          id="driverInput" 
          placeholder="Ej. Carlos Mendoza" 
          autocomplete="off"
        >
        <span class="error-message" id="driverError"></span>
      </div>

      <button type="submit" id="btnRegister" class="btn-submit">Registrar Turno</button>
    </form>
  </div>

  </div> <!-- AGREGADO: cierre de .registro-layout -->

  <script src="registro.js"></script>
</body>
</html>
